name: CI PlaniLux

on:
  push:
    branches: ["main", "feat/**", "chore/**", "fix/**"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, types, tests et build
    runs-on: ubuntu-latest
    env:
      # Valeurs factices : le build n'a besoin d'aucun secret.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build Next.js
        run: npm run build
      - name: Audit des dépendances (informatif)
        run: npm audit --audit-level=high
        continue-on-error: true
